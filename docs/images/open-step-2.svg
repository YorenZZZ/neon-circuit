<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">在系统设置中允许这一个应用</title><desc id="desc">系统设置（System Settings）→ 隐私与安全（Privacy &amp; Security）。 操作示意图，文案及布局随 macOS 版本变化。</desc><defs>
