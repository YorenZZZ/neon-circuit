<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">先尝试打开应用</title><desc id="desc">放进「应用程序」（Applications）后，双击 NEON Circuit.app。 操作示意图，文案及布局随 macOS 版本变化。</desc><defs>
