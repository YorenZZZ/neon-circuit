4 327 422 327"/><rect x="492" y="259" width="525" height="410" rx="22" fill="white" stroke="#cbd1d9" filter="url(#shadow)"/><g transform="translate(721 290) scale(0.9444444444444444)"><rect width="72" height="72" rx="17" fill="#111a25"/><path d="M17 12 L18 57 L30 43 L43 62 L51 57 L39 38 L56 36 Z" fill="#263c49" stroke="#35e4ed" stroke-width="3.8" stroke-linejoin="round"/><path d="M25 23 L26 40 M31 30 L43 34 M35 44 L41 54" fill="none" stroke="#fb55bc" stroke-width="2.8" stroke-linecap="round"/></g><text x="754" y="397" font-size="26" text-anchor="middle" class="bold">无法打开“NEON Circuit”</text><text x="754" y="434" font-size="25" text-anchor="middle" class="bold">因为无法验证开发者。</text><text x="754" y="486" font-size="21" text-anchor="middle" class="muted">macOS 无法确认此应用已获 Apple 公证。</text><rect x="527" y="553" width="218" height="62" rx="12" fill="#edf0f4" stroke="#d7dde5"/><rect x="765" y="553" width="216" height="62" rx="12" fill="#edf0f4" stroke="#d7dde5"/><text x="636" y="591" font-size="22" text-anchor="middle">移到废纸篓</text><text x="873" y="591" font-size="22" text-anchor="middle">完成  (Done)</text><text x="754" y="646" font-size="19" text-anchor="middle" class="pink">关闭提示后，进入下一步。</text><text x="550" y="813" font-size="18" text-anchor="middle" class="muted">操作示意图 · 文案及布局随 macOS 版本变化</text></svg>