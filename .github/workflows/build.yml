name: Build and offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Universal app
        run: ./scripts/build.sh
      - name: Offline checks (no cursor changes)
        run: ./tests/check.sh
